<!DOCTYPE html>
<html>

<head>
    <title>grid</title>
</head>

<body>
    <div class="container" style="display: grid;
    grid-template-columns: 100px 100px;
    ">
        <div style="background-color: lightblue;">100px</div>
        <div style="background-color: lightgreen;">100px</div>

    </div>

    <div class="container" style="display: grid; margin-top: 20px;
    grid-template-columns: 100px 100px 250px;
    ">
        <div style="background-color: lightblue;">100px</div>
        <div style="background-color: lightgreen;">100px</div>
        <div style="background-color: lightblue;">250px</div>
        <div style="background-color: lightgreen;">100px</div>
    </div>

    <div class="container" style="display: grid; margin-top: 50px;
    grid-template-columns: 100px 1fr;
    ">
        <div style="background-color: lightblue;">100px</div>
        <div style="background-color: lightgreen;">1fr</div>
    </div>

    <div class="container" style="display: grid; margin-top: 50px;
    grid-template-columns: 100px 1fr 1fr;
    ">
        <div style="background-color: lightblue;">100px</div>
        <div style="background-color: lightgreen;">1fr</div>
        <div style="background-color: lightblue;">1fr</div>
    </div>

    <div class="container" style="display: grid; margin-top: 50px;
    grid-template-columns: 100px 2fr 1fr;
    ">
        <div style="background-color: lightblue;">100px</div>
        <div style="background-color: lightgreen;">2fr</div>
        <div style="background-color: lightblue;">1fr</div>
    </div>
    
    <div class="container" style="display: grid; margin-top: 50px;
    grid-template-columns: 1fr 1fr 1fr;
    column-gap: 20px;
    row-gap: 30px;
    ">
        <div style="background-color: lightblue; height: 200px;">1fr</div>
        <div style="background-color: lightgreen;">1fr</div>
        <div style="background-color: lightblue;">1fr</div>
        <div style="background-color: lightgreen;">1fr</div>
        <div style="background-color: lightblue;">1fr</div>
        <div style="background-color: lightgreen; height: 200px;">1fr</div>
    </div>
</body>

</html>
