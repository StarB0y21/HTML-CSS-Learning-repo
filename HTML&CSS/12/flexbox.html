<!DOCTYPE html>
<html>

<head>
    <title>flexbox</title>
</head>

<body>
    <div style="display: flex; flex-direction: row;">
        <div style="background-color: lightblue;">div1 more text</div>
        <div style="background-color: lightgreen;">
            div2
            <p>new row</p>
        </div>
    </div>

    <div style="display: flex; flex-direction: row; margin-top: 30px;">
        <div style="background-color: lightblue; width: 100px;">100px</div>
        <div style="background-color: lightgreen; width: 100px;">100px</div>
    </div>

    <div style="display: flex; flex-direction: row; margin-top: 30px;">
        <div style="background-color: lightblue; width: 100px;">100px</div>
        <div style="background-color: lightgreen; flex: 1;">felx1</div>
    </div>

    <div style="display: flex; flex-direction: row; margin-top: 30px;">
        <div style="background-color: lightblue; width: 100px;">100px</div>
        <div style="background-color: lightgreen; flex: 1;">felx1</div>
        <div style="background-color: lightblue; flex: 1;">flex1</div>
    </div>

    <div style="display: flex; flex-direction: row; margin-top: 30px;">
        <div style="background-color: lightblue; width: 100px;">100px</div>
        <div style="background-color: lightgreen; flex: 2;">felx2</div>
        <div style="background-color: lightblue; flex: 1;">flex1</div>
    </div>
    <div style="
        display: flex; 
        flex-direction: row; 
        margin-top: 30px; 
        border: 1px solid gray; 
        justify-content: space-between;
        height: 100px;
        align-items: center;
    ">
        <div style="background-color: lightblue; width: 100px;">100px</div>
        <div style="background-color: lightgreen; width: 100px;">100px</div>
        <div style="background-color: lightblue; width: 100px;">100px</div>
    </div>
</body>

</html>
