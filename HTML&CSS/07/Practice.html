<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practice 07</title>
    <style>
        body {
            background-color: #6DD0F7;
        }

        img {
            width: 300px;
            margin-right: 100px;
            vertical-align: middle;
        }

        .rounded-corners {
            border-radius: 10px;
            width: 250px;
        }

        .closeup {
            width: 200px;
            height: 200px;
            object-fit: cover;
        }

        .circle {
            border-radius: 150px;
            width: 200px;
            height: 200px;
            object-fit: cover;
        }

        input {
            width: 200px;
            height: 15px;
            border-radius: 5px;
            border: 1px solid black;
            padding: 8px;
        }

        .boxshadow-searchbox {
            box-shadow: 1px 6px 6px rgba(0, 0, 0, 0.3);
            margin-left: 10px;
        }
    </style>
</head>

<body>
    <img src="images.jpg" class="rounded-corners">
    <img src="images.jpg" class="closeup">
    <img src="images.jpg" class="circle">
    <hr>
    <input type="text" placeholder="Search...">
    <input type="text" class="boxshadow-searchbox" placeholder="Search...">
</body>

</html>
