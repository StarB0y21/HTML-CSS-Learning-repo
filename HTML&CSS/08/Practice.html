<!DOCTYPE html>
<html>

<head>
    <title>08</title>

    <style>
        div {
            border: 1px solid black;
            width: 700px;
            height: 250px;
            margin: 10px;
        }

        .first,
        .second {
            height: 110px;
        }

        .information-input {
            border: 1px solid gray;
            display: block;
            width: 183px;
            height: 22px;
            border-radius: 3px;
            margin: 15px;
            padding: 1px 6px 1px 6px;
        }

        p {
            display: inline-block;
            width: 210px;
            margin-left: 28px;
            vertical-align: middle;
        }

        .question-button {
            vertical-align: middle;
        }

        .google-img {
            width: 280px;
            display: block;
            padding: 15px 0;
        }

        .search-box {
            width: 370px;
            height: 25px;
            border-radius: 18px;
            border: 1px solid rgba(0, 0, 0, 0.4);
            padding: 3px 15px;
            display: block;
        }

        .google-img,
        .search-box {
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <div class="first">
        <input class="information-input" type="text" placeholder="Name">
        <input class="information-input" type="text" placeholder="Email">
    </div>
    <div class="second">
        <p>Thanks for chatting with our customer support. Would you like to take our quick survey?</p>
        <button class="question-button">Yes</button>
        <button class="question-button">No</button>
    </div>
    <div class="third">
        <img class="google-img" src="google.webp">
        <input type="text" class="search-box" placeholder="Search Google or type a URL">
    </div>
</body>

</html>
