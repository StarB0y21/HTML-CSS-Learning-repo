<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice 09</title>
    <style>
        body {
            font-family: sans-serif;
        }

        .red-div {
            width: 150px;
            height: 150px;
            background-color: red;
            display: inline-block;
            margin-right: 25px;
        }

        .green-div {
            width: 150px;
            height: 150px;
            background-color: green;
            border-radius: 75px;
            display: inline-block;
            margin-left: 25px;
        }

        .satisfied-div {
            padding: 20px 10px;
            border: 1px solid black;
            background-color: white;
            width: 350px;
            margin: 20px 0;
        }

        .satisfied-title {
            font-size: 20px;
            font-weight: bold;
        }

        .istall-div {
            padding: 20px 10px;
            background-color: rgb(24, 24, 24);
            color: whitesmoke;
            display: inline-block;
            width: 350px;
            color: whitesmoke;
        }

        .istall-title {
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="red-div"></div>
    <div class="green-div"></div>
    <div class="satisfied-div">
        <p class="satisfied-title">Satisfied with our service?</p>
        <button>Yes</button>
        <button>No</button>
    </div>
    <div class="istall-div">
        <p class="istall-title">Install YouTube Music</p>
        <p>Add YouTube Music to your desktop for quick and easy access.</p>
    </div>
</body>

</html>
