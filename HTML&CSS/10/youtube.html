<!DOCTYPE html>
<html>

<head>
    <title>Youtube Clone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <style>
        p {
            margin-top: 0;
            font-family: Roboto, arial;
        }

        .thumbnail {
            width: 300px;
            display: block;
        }

        .thumbnail-container {
            margin-bottom: 10px;
        }

        .search-bar {
            font-size: 15px;
            padding: 10px;
            margin: 20px;
            display: block;
        }

        .video-title {
            /* width: 300px; */
            font-size: 14px;
            font-weight: 500;
            line-height: 20px;
            margin-bottom: 13px;
        }

        .video-author {
            margin-bottom: 4px;
        }

        .video-author,
        .video-stats {
            font-size: 12px;
            color: rgb(96, 96, 96);
        }

        .video-preview {
            width: 300px;
            display: inline-block;
            vertical-align: top;
            margin-right: 15px;
        }

        .channel-pic {
            display: inline-block;
            width: 50px;
            vertical-align: top;
        }

        .channel-image {
            width: 40px;
            border-radius: 20px;
        }

        .video-info {
            display: inline-block;
            width: 200px;
            vertical-align: top;
        }
    </style>
</head>

<body>
    <input type="text" placeholder="Search..." class="search-bar" id="">
    <div class="video-preview">
        <div class="thumbnail-container">
            <img class="thumbnail" src="thumbnails/thumbnail.png" alt="thumbnail template">
        </div>
        <div>
            <div class="channel-pic">
                <img src="channel image/images (1).jpg" class="channel-image">
            </div>
            <div class="video-info">
                <p class="video-title">Talking Tech and AI with Google CEO Sundar Pichail</p>
                <p class="video-author">Marques Brownlee</p>
                <p class="video-stats">3.4 views &#183; 6 month ago</p>
            </div>
        </div>
    </div>
    
    <div class="video-preview">
        <div class="thumbnail-container">
            <img class="thumbnail" src="thumbnails/thumbnail.png" alt="thumbnail template">
        </div>
        <div>
            <div class="channel-pic">
                <img src="channel image/images (1).jpg" class="channel-image">
            </div>
            <div class="video-info">
                <p class="video-title">Talking Tech and AI with Google CEO Sundar Pichail</p>
                <p class="video-author">Marques Brownlee</p>
                <p class="video-stats">3.4 views &#183; 6 month ago</p>
            </div>
        </div>
    </div>
</body>

</html>
