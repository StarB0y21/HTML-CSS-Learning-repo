<!DOCTYPE html>
<html lang="en">
<head>
    <title>Position</title>
</head>
<body style="
    margin-bottom: 1000px; 
    padding-top: 60px;
    padding-left: 80px;
">
    <div style="
        background-color: black; 
        color: white;
        position: fixed;
        top: 0px;
        left: 0px;
        right: 0px;
        height: 50px;
        z-index: 1;
    ">header</div>
    <div style="
        background-color: blueviolet;
        position: fixed;
        left: 0;
        top: 50px;
        bottom: 0;
        width: 70px;
    ">
        sidebar
        <div style="
            background-color: red;
            color: white;
            position: absolute;
            right: -5px;
            top: 0;
        ">x</div>
    </div>
    <div style="
        background-color: green;
        position: absolute;
        top: 50px;
        right: 100px;
    ">absolute</div>
    <div style="
        background-color: lightblue; 
        width: 300px; 
        height: 300px;
        position: static;
    ">div1</div>
    <div style="
        background-color: lightpink; 
        width: 300px; 
        height: 300px;
        position: relative;
    ">
        div2
        <div style="
            background-color: red;
            color: white;
            position: absolute;
            right: 10px;
            bottom: 30px;
        ">30:20</div>
    </div>
</body>
</html>
